; Machine Hunter - impostazioni WINMX.dll
[video]
; render della scena 3D: classico (quello del gioco, a 256 colori migliorato) o nuovo (disegnato dalla scheda video, in prova)
render=nuovo
; rapporto d'aspetto: auto (quello dello schermo), oppure 16:9, 21:9, 32:9, 16:10, 4:3, o un numero (es. 2.37)
aspect=auto
; 1 = senza bordi a schermo intero, 0 = finestra
mode=1
; filtro anti-banding (riduce gli aloni dei 256 colori)
deband=0
deband_threshold=8
deband_radius=32
; 1 = riempie tutto lo schermo, 0 = proporzioni esatte (bande nere)
stretch=1
; 1 = sincronizzazione verticale
vsync=0
dither=1
; scaling morbido
smooth=1
; HUD: dimensione in % rispetto all'originale (100 = proporzioni PS1)
hud_scale=75
; filtro per HUD e testi: 0 pixel, 1 bilineare, 2 bicubico, 3 nitido (pixel netti, bordi morbidi)
hud_filter=3
menu_filter=3
; area in cui i nemici vengono creati e si muovono: 1 = allargata per lo schermo largo, 0 = come il gioco originale (4:3)
area_nemici=1
; nemici che si incastrano contro oggetti che la loro IA non vede (casse): 1 = cambiano strada, 0 = come l'originale
ia_ostacoli=1

[startup]
; missione da cui parte "Inizia partita": 1-17 (0 = normale, dalla prima)
level=0
; 0 = niente domande all'avvio (finestra, filmati come sotto)
ask=0
movies=0
[audio]
; tracce in MUSIC\Track02.wav (o .mp3), estratte dal CD
music=1
[input]
pad=1
; valori: 0 croce, 1 quadrato, 2 cerchio, 3 triangolo, 4 L1, 5 R1, 6 L2, 7 R2
; sparo (come da manuale): button1 = sinistra, button2 = su, button3 = giu, button4 = destra
button1=1
button2=3
button3=0
button4=2
deadzone=30
; altri tasti -> tastiera (codice VK): L1 strafe, L2 arma secondaria, R1/R2 cambio armi, Options pausa (INVIO), Create mappa
; 17 CTRL, 32 SPAZIO, 87 W, 83 S, 27 ESC, 9 TAB, 13 INVIO
key_l1=17
key_r1=87
key_l2=32
key_r2=83
key_options=13
key_create=9

[giocatore]

; colore della tuta: viola (come su PS1), arancione (PC originale), blu, verde, rosso, oppure una tinta in gradi (0-359)

colore=viola

[foto]

; 1 = la foto fatta in modalita' foto diventa anche l'anteprima della missione (UI_HD\NOMEF.raw); 0 = la foto resta solo in FOTO

anteprima=0
